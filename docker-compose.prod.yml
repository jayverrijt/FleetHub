services:
  # ==========================================
  # TESTING ENVIRONMENT (feature/** branches)
  # ==========================================
  mysql-test:
    image: mysql:8.0
    container_name: fleethub-mysql-test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test_root_password}
      MYSQL_DATABASE: fleethub_test
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-test_root_password}"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - fleethub-net

  backend-test:
    image: ghcr.io/jayverrijt/fleethub-backend:test
    container_name: fleethub-api-test
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-test:3306/fleethub_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test_root_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: "86400000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_TEST:-http://10.69.0.48:3000}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_TEST:-http://10.69.0.48:3000}
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - fleethub-net

  frontend-test:
    image: ghcr.io/jayverrijt/fleethub-frontend:test
    container_name: fleethub-frontend-test
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - fleethub-net

  # ==========================================
  # PRODUCTION ENVIRONMENT (main branch)
  # ==========================================
  mysql-prod:
    image: mysql:8.0
    container_name: fleethub-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_root_password}
      MYSQL_DATABASE: fleethub_prod
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-prod_root_password}"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks:
      - fleethub-net

  backend-prod:
    image: ghcr.io/jayverrijt/fleethub-backend:latest
    container_name: fleethub-api-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/fleethub_prod?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-prod_root_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: "86400000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PROD:-http://10.69.0.48}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PROD:-http://10.69.0.48}
    depends_on:
      mysql-prod:
        condition: service_healthy
    networks:
      - fleethub-net

  frontend-prod:
    image: ghcr.io/jayverrijt/fleethub-frontend:latest
    container_name: fleethub-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - fleethub-net

  # ==========================================
  # QUALITY GATE (SonarQube)
  # ==========================================
  sonarqube:
    image: sonarqube:community
    container_name: fleethub-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - fleethub-net

volumes:
  mysql_test_data:
  mysql_prod_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  fleethub-net:
    name: fleethub-net
    driver: bridge
