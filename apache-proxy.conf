ServerName localhost

# Zorg dat benodigde proxy-modules geladen zijn
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so

<VirtualHost *:80>
    ProxyPreserveHost On

    # 1. API routes doorsturen naar de Spring Boot container
    ProxyPass /api http://backend-prod:8080/api
    ProxyPassReverse /api http://backend-prod:8080/api

    # 2. Overig verkeer doorsturen naar de React Frontend
    ProxyPass / http://frontend-prod:80/
    ProxyPassReverse / http://frontend-prod:80/
</VirtualHost>
