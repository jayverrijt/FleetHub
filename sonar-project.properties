# Overkoepelende monorepo configuratie voor self-hosted SonarQube
sonar.projectKey=fleethub
sonar.projectName=FleetHub
sonar.host.url=http://10.69.0.48:9000

# Broncode van beide lagen meenemen
sonar.sources=FleetHub_Backend/src/main/java,FleetHub_Frontend/src

# Tests
sonar.tests=FleetHub_Backend/src/test/java,FleetHub_Frontend/src
sonar.test.inclusions=**/*Test.java,**/*.test.js,**/*.test.jsx

# Binaries voor Java
sonar.java.binaries=FleetHub_Backend/build/classes/java/main

# Coverage rapporten (Backend JaCoCo + Frontend Vitest LCOV)
sonar.coverage.jacoco.xmlReportPaths=FleetHub_Backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=FleetHub_Frontend/coverage/lcov.info

# Uitsluitingen
sonar.coverage.exclusions=**/BackendApplication.java,**/dto/**,**/model/**,**/config/**,FleetHub_Frontend/src/main.jsx,FleetHub_Frontend/dist/**
sonar.cpd.exclusions=**/dto/**,**/model/**
