sonar.projectKey=fleethub
sonar.projectName=FleetHub
sonar.host.url=http://10.69.0.48:9000

# Broncode van beide lagen meenemen (alleen applicatielogica)
sonar.sources=FleetHub_Backend/src/main/java,FleetHub_Frontend/src

# Tests: Unit tests én Cypress E2E tests
sonar.tests=FleetHub_Backend/src/test/java,FleetHub_Frontend/src,FleetHub_Frontend/cypress
sonar.test.inclusions=**/*Test.java,**/*.test.js,**/*.test.jsx,FleetHub_Frontend/cypress/**/*.cy.js

# Binaries voor Java
sonar.java.binaries=FleetHub_Backend/build/classes/java/main

# Coverage rapporten (Backend JaCoCo + Frontend Vitest LCOV)
sonar.coverage.jacoco.xmlReportPaths=FleetHub_Backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=FleetHub_Frontend/coverage/lcov.info

# Uitsluitingen (VOORKOMT DAT COVERAGE INZAKT)
sonar.coverage.exclusions=\
  FleetHub_Backend/src/main/java/nl/fleethub/backend/BackendApplication.java,\
  FleetHub_Backend/src/main/java/nl/fleethub/backend/dto/**/*,\
  FleetHub_Backend/src/main/java/nl/fleethub/backend/model/**/*,\
  FleetHub_Backend/src/main/java/nl/fleethub/backend/config/**/*,\
  FleetHub_Backend/src/main/java/nl/fleethub/backend/security/SecurityConfig.java,\
  FleetHub_Frontend/src/main.jsx,\
  FleetHub_Frontend/dist/**/*,\
  FleetHub_Frontend/cypress/**/*

# Duplicatie-uitsluitingen
sonar.cpd.exclusions=**/dto/**,**/model/**,FleetHub_Frontend/cypress/**
