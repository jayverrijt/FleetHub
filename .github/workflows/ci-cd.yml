name: FleetHub CI/CD

on:
  push:
    branches:
      - production
      - "feature/**"
  pull_request:
    branches:
      - production

jobs:
  build-and-test:
    name: 1. CI - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FleetHub_Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - run: chmod +x gradlew
      - run: ./gradlew clean --no-daemon
      - run: ./gradlew compileJava compileTestJava --no-daemon
      - run: ./gradlew check -x compileJava -x compileTestJava --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: FleetHub_Backend/build/reports/tests/test/

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: FleetHub_Backend/build/reports/jacoco/test/html/

      - if: success()
        run: ./gradlew bootJar -x test --no-daemon

      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-spring-jar
          path: FleetHub_Backend/build/libs/*.jar

  github-release:
    name: 2. Create GitHub Release (Production Only)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref_name == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: ./release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release/*.jar
          draft: false
          prerelease: false

  deploy-to-vps:
    name: 3. CD - Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: FleetHub_Backend/build/libs/

      - id: env-targets
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "DOCKER_TAG=prod" >> $GITHUB_OUTPUT
            echo "COMPOSE_SERVICE=backend-prod" >> $GITHUB_OUTPUT
          else
            echo "DOCKER_TAG=test" >> $GITHUB_OUTPUT
            echo "COMPOSE_SERVICE=backend-test" >> $GITHUB_OUTPUT
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./FleetHub_Backend
          file: ./FleetHub_Backend/Dockerfile
          push: true
          tags: ghcr.io/jayverrijt/fleethub-backend:${{ steps.env-targets.outputs.DOCKER_TAG }}

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull ${{ steps.env-targets.outputs.COMPOSE_SERVICE }}
            docker compose up -d --no-deps ${{ steps.env-targets.outputs.COMPOSE_SERVICE }}
            docker image prune -f
