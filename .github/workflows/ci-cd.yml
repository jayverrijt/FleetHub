name: FleetHub CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "functions/**"
      - "feature-*"
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # FASE 1: BUILD JOBS (Parallel)
  # ==========================================
  build-backend:
    name: 1a. Build - Backend (Java Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compile Backend & Package JAR
        working-directory: ./FleetHub_Backend
        run: |
          chmod +x gradlew
          ./gradlew clean compileJava --no-daemon
          ./gradlew bootJar -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-spring-jar
          path: FleetHub_Backend/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-classes
          path: FleetHub_Backend/build/classes/java/main/

  build-frontend:
    name: 1b. Build - Frontend (React Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FleetHub_Frontend/package-lock.json

      - name: Install & Build Production Bundle
        working-directory: ./FleetHub_Frontend
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'main' && 'http://10.69.0.48:8080/api' || 'http://10.69.0.48:8081/api' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: built-frontend-dist
          path: FleetHub_Frontend/dist/

  # ==========================================
  # FASE 2: TEST JOBS (Parallel)
  # ==========================================
  test-backend:
    name: 2a. Test - Backend (JUnit & JaCoCo)
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Backend Unit Tests & Coverage
        working-directory: ./FleetHub_Backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: FleetHub_Backend/build/reports/tests/test/

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: FleetHub_Backend/build/reports/jacoco/test/

  test-frontend:
    name: 2b. Test - Frontend (ESLint & Vitest)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FleetHub_Frontend/package-lock.json

      - name: Run Linting & Unit Tests
        working-directory: ./FleetHub_Frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: FleetHub_Frontend/coverage/

  # ==========================================
  # FASE 3: SONARQUBE QUALITY GATE & VPN
  # ==========================================
  sonar-analysis:
    name: 3. Quality - SonarQube Analysis (Self-Hosted via VPN)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: backend-classes
          path: FleetHub_Backend/build/classes/java/main

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: FleetHub_Backend/build/reports/jacoco/test

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: FleetHub_Frontend/coverage

      - name: Connect to Fontys Netlab OpenVPN
        run: |
          sudo apt-get install -y openvpn iproute2 curl
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn

          sudo touch /tmp/openvpn.log
          sudo chmod 666 /tmp/openvpn.log

          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt --tun-mtu 1500 --mssfix 1400 --log /tmp/openvpn.log --daemon

          echo "Wachten op OpenVPN verbinding..."
          CONNECTED=false
          for i in {1..30}; do
            if sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null; then
              echo "OpenVPN handshake voltooid!"
              CONNECTED=true
              break
            fi
            sleep 1
          done

          if [ "$CONNECTED" = false ]; then
            echo "--- OPENVPN LOGS ---"
            sudo cat /tmp/openvpn.log
            exit 1
          fi

          sleep 3

          echo "Controleer bereikbaarheid van SonarQube op 10.69.0.48:9000..."
          if ! curl --silent --show-error --connect-timeout 8 --max-time 15 http://10.69.0.48:9000/api/v2/analysis/version; then
            echo ""
            echo "FOUT: Poort 9000 niet bereikbaar via VPN tunnel! Netwerk trace:"
            ping -c 3 10.69.0.48 || true
            echo "--- OPENVPN LOGS ---"
            sudo cat /tmp/openvpn.log
            exit 1
          fi
          echo ""
          echo "SonarQube is bereikbaar!"
          rm -f vpn-auth.txt

      - name: Code Quality & Coverage Analysis (Self-Hosted SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SCANNER_VERSION="7.2.0.5079"
          echo "Downloaden SonarScanner CLI..."
          curl -sSLo /tmp/sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q /tmp/sonar-scanner.zip -d /tmp
          
          SCANNER_DIR="/tmp/sonar-scanner-${SCANNER_VERSION}-linux-x64"

          rm -rf "${SCANNER_DIR}/jre"
          ln -s "${JAVA_HOME}" "${SCANNER_DIR}/jre"

          echo "Gebruikte Java versie:"
          "${SCANNER_DIR}/jre/bin/java" -version

          "${SCANNER_DIR}/bin/sonar-scanner" \
            -Dsonar.scanner.skipJreProvisioning=true \
            -Dsonar.scanner.socketTimeout=120 \
            -Dsonar.projectKey=fleethub \
            -Dsonar.projectName=FleetHub \
            -Dsonar.host.url=http://10.69.0.48:9000 \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.sources=FleetHub_Backend/src/main/java,FleetHub_Frontend/src \
            -Dsonar.tests=FleetHub_Backend/src/test/java,FleetHub_Frontend/src \
            -Dsonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*Test.java \
            -Dsonar.java.binaries=FleetHub_Backend/build/classes/java/main \
            -Dsonar.coverage.jacoco.xmlReportPaths=FleetHub_Backend/build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.javascript.lcov.reportPaths=FleetHub_Frontend/coverage/lcov.info \
            -Dsonar.coverage.exclusions=**/BackendApplication.java,**/dto/**,**/model/**,**/config/**,FleetHub_Frontend/src/main.jsx,FleetHub_Frontend/dist/** \
            -Dsonar.cpd.exclusions=**/dto/**,**/model/**

  # ==========================================
  # FASE 4: RELEASE (Alleen main)
  # ==========================================
  github-release:
    name: 4. Create GitHub Release (Production on Main)
    needs: sonar-analysis
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: ./release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release/*.jar
          draft: false
          prerelease: false

  # ==========================================
  # FASE 5: DEPLOYMENT NAAR VPS
  # ==========================================
  deploy-to-vps:
    name: 5. CD - Deploy to VPS
    needs: sonar-analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: compiled-spring-jar
          path: FleetHub_Backend/build/libs/

      - uses: actions/download-artifact@v4
        with:
          name: built-frontend-dist
          path: FleetHub_Frontend/dist/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./FleetHub_Backend
          file: ./FleetHub_Backend/Dockerfile
          push: true
          tags: ghcr.io/jayverrijt/fleethub-backend:latest

      - uses: docker/build-push-action@v5
        with:
          context: ./FleetHub_Frontend
          file: ./FleetHub_Frontend/Dockerfile
          push: true
          tags: ghcr.io/jayverrijt/fleethub-frontend:latest

      - name: Connect to Fontys Netlab OpenVPN
        run: |
          sudo apt-get install -y openvpn
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn
          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt --tun-mtu 1500 --mssfix 1400 --daemon
          sleep 10
          rm -f vpn-auth.txt

      - name: Sync docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "~"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: MYSQL_ROOT_PASSWORD,MYSQL_PASSWORD,JWT_SECRET
          script: |
            cd ~

            # 1. Genereer de veilige .env op de VPS
            cat <<EOF > .env
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            MYSQL_USER=fleethub
            MYSQL_PASSWORD=$MYSQL_PASSWORD
            JWT_SECRET=$JWT_SECRET
            CORS_ALLOWED_ORIGINS=http://10.69.0.48:3000,http://10.69.0.48,http://localhost:3000,http://localhost:5173
            EOF

            chmod 600 .env

            # 2. Inloggen op GHCR en containers herstarten met de nieuwe images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml up -d mysql
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps backend frontend
            docker image prune -f
