name: FleetHub CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "functions/**"
      - "feature-*"
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # FASE 1: BUILD JOBS (Parallel)
  # ==========================================
  build-backend:
    name: 1a. Build - Backend (Java Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compile Backend & Package JAR
        working-directory: ./FleetHub_Backend
        run: |
          chmod +x gradlew
          ./gradlew clean compileJava --no-daemon
          ./gradlew bootJar -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-spring-jar
          path: FleetHub_Backend/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: backend-classes
          path: FleetHub_Backend/build/classes/java/main/

  build-frontend:
    name: 1b. Build - Frontend (React Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FleetHub_Frontend/package-lock.json

      - name: Install & Build Production Bundle
        working-directory: ./FleetHub_Frontend
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'main' && 'http://10.69.0.48:8080/api' || 'http://10.69.0.48:8081/api' }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: built-frontend-dist
          path: FleetHub_Frontend/dist/

  # ==========================================
  # FASE 2: TEST JOBS (Parallel)
  # ==========================================
  test-backend:
    name: 2a. Test - Backend (JUnit & JaCoCo)
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Backend Unit Tests & Coverage
        working-directory: ./FleetHub_Backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: FleetHub_Backend/build/reports/tests/test/

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: FleetHub_Backend/build/reports/jacoco/test/

  test-frontend:
    name: 2b. Test - Frontend (ESLint & Vitest)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FleetHub_Frontend/package-lock.json

      - name: Run Linting & Unit Tests
        working-directory: ./FleetHub_Frontend
        run: |
          npm ci
          npm run lint
          npm run test:unit

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: FleetHub_Frontend/coverage/

  # ==========================================
  # FASE 3: SONARQUBE QUALITY GATE & VPN
  # ==========================================
  sonar-analysis:
    name: 3. Quality - SonarQube Analysis (Self-Hosted via VPN)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Download de gecompileerde classes en testrapporten van eerdere fasen
      - uses: actions/download-artifact@v4
        with:
          name: backend-classes
          path: FleetHub_Backend/build/classes/java/main

      - uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: FleetHub_Backend/build/reports/jacoco/test

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: FleetHub_Frontend/coverage

      # OpenVPN Verbinding naar Netlab (inclusief log permission fix en routering)
      - name: Connect to Fontys Netlab OpenVPN
        run: |
          sudo apt-get install -y openvpn iproute2 curl
          echo "${{ secrets.OPENVPN_USER }}" > vpn-auth.txt
          echo "${{ secrets.OPENVPN_PASSWORD }}" >> vpn-auth.txt
          echo "${{ secrets.OPENVPN_CONFIG }}" > client.ovpn

          # Maak logbestand aan met leesrechten voor runner
          sudo touch /tmp/openvpn.log
          sudo chmod 666 /tmp/openvpn.log

          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt --tun-mtu 1500 --mssfix 1400 --log /tmp/openvpn.log --daemon

          echo "Wachten op OpenVPN verbinding..."
          CONNECTED=false
          for i in {1..30}; do
            if sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null; then
              echo "OpenVPN handshake voltooid!"
              CONNECTED=true
              break
            fi
            sleep 1
          done

          if [ "$CONNECTED" = false ]; then
            echo "--- OPENVPN LOGS ---"
            sudo cat /tmp/openvpn.log
            exit 1
          fi

          # Wijs verkeer voor het Fontys VPS netwerk expliciet toe aan tun0
          sudo ip route add 10.69.0.0/16 dev tun0 || true

          # Debug: controleer de actieve routing
          ip route show

          echo "Controleer bereikbaarheid van SonarQube op 10.69.0.48:9000..."
          if ! curl --silent --show-error --connect-timeout 8 --max-time 15 http://10.69.0.48:9000/api/v2/analysis/version; then
            echo ""
            echo "FOUT: Poort 9000 niet bereikbaar via VPN tunnel! Netwerk trace:"
            ping -c 3 10.69.0.48 || true
            echo "--- OPENVPN LOGS ---"
            sudo cat /tmp/openvpn.log
            exit 1
          fi
          echo ""
          echo "SonarQube is bereikbaar!"
          rm -f vpn-auth.txt

      # SonarQube Scanner (Gebruikt Java 21 van de runner)
      - name: Code Quality & Coverage Analysis (Self-Hosted SonarQube)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        with:
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.socketTimeout=120
            -Dsonar.projectKey=fleethub
            -Dsonar.projectName=FleetHub
            -Dsonar.host.url=http://10.69.0.48:9000
            -Dsonar.sources=FleetHub_Backend/src/main/java,FleetHub_Frontend/src
            -Dsonar.tests=FleetHub_Backend/src/test/java,FleetHub_Frontend/src
