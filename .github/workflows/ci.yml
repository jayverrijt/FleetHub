name: FleetHub Backend CI

on:
  push:
    branches: [ "production", "development", "feature/**" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build-and-test:
    name: Build & Verify Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./FleetHub_Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: 1. Clean Project
        run: ./gradlew clean --no-daemon

      - name: 2. Compile Application and Test Code
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: 3. Run Tests & Coverage Verification (JaCoCo)
        run: ./gradlew check --no-daemon

      - name: 4. Package Executable JAR
        if: success()
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-test-report
          path: FleetHub_Backend/build/reports/jacoco/test/html/

      - name: Upload Built JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: FleetHub_Backend/build/libs/*.jar
