plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'jacoco'
    id "org.sonarqube" version "6.0.1.5171"
}

group = 'nl.fleethub'
version = '0.0.1-SNAPSHOT'
description = 'backend'

// Dwing Java 21 (LTS) af via de Gradle Toolchain voor zowel compilatie als testen
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Web & REST API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security and bCrypt for hashing
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Java JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Data persistence & Database migraties (Flyway)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-subclass:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.security:spring-security-test'

}

springBoot {
    mainClass = 'nl.fleethub.backend.BackendApplication'
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs([
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
    ])
    // Sluit interne JVM/JDK packages expliciet uit voor de JaCoCo runtime transformatie:
    systemProperty 'jacoco-agent.excludes', 'sun.*:jdk.*:org.gradle.*:com.sun.*'
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'nl/fleethub/backend/BackendApplication.class',
                    'nl/fleethub/backend/dto/**',
                    'nl/fleethub/backend/model/**',
                    'nl/fleethub/backend/repository/**',
                    'nl/fleethub/backend/security/SecurityConfig.class',
                    'nl/fleethub/backend/security/JwtAuthenticationFilter.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            excludes = [
                    'nl.fleethub.backend.BackendApplication',
                    'nl.fleethub.backend.dto.*',
                    'nl.fleethub.backend.model.*',
                    'nl.fleethub.backend.repository.*',
                    'nl.fleethub.backend.security.SecurityConfig',
                    'nl.fleethub.backend.security.JwtAuthenticationFilter'
            ]
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "jayverrijt_fleethub-backend" // Exacte key uit SonarCloud
        property "sonar.organization", "jayverrijt"                 // Exacte org uit SonarCloud
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}