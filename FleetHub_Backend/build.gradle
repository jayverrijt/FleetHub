plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'jacoco'
}

group = 'nl.fleethub'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    // Web & Validation
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Data persistence & Database migraties (Flyway)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Spring Security & BCrypt (US1)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JJWT (Java JWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-subclass:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

springBoot {
    mainClass = 'nl.fleethub.backend.BackendApplication'
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs([
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true'
    ])
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'nl/fleethub/backend/BackendApplication.class',
                    'nl/fleethub/backend/dto/**',
                    'nl/fleethub/backend/model/**',
                    'nl/fleethub/backend/repository/**',
                    'nl/fleethub/backend/security/SecurityConfig.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            excludes = [
                    'nl.fleethub.backend.BackendApplication',
                    'nl.fleethub.backend.dto.*',
                    'nl.fleethub.backend.model.*',
                    'nl.fleethub.backend.repository.*',
                    'nl.fleethub.backend.security.SecurityConfig'
            ]
        }
    }
}

tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}
