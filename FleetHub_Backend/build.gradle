plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
}

group = 'nl.fleethub'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Voorkomt dat Mockito via bytecode-manipulatie crasht op JDK 25 runtime classes
    testImplementation 'org.mockito:mockito-subclass:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'nl.fleethub.backend.BackendApplication'
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.named('test') {
    useJUnitPlatform()
    // Sta toe dat tests JVM-reflectie doen zonder bytecode crash
    jvmArgs(['-XX:+EnableDynamicAgentLoading', '-Dnet.bytebuddy.experimental=true'])
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'nl/fleethub/backend/BackendApplication.class',
                    'nl/fleethub/backend/dto/**',
                    'nl/fleethub/backend/model/**',
                    'nl/fleethub/backend/repository/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            excludes = [
                    'nl.fleethub.backend.BackendApplication',
                    'nl.fleethub.backend.dto.*',
                    'nl.fleethub.backend.model.*',
                    'nl.fleethub.backend.repository.*',
                    'nl.fleethub.backend.controller.VehicleController',
                    'nl.fleethub.backend.service.VehicleService'
            ]
        }
    }
}

tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}