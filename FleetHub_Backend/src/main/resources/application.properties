spring.application.name=FleetHub_Backend

# MySQL Verbinding (Docker container)
spring.datasource.url=jdbc:mysql://localhost:3306/fleethub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Laat Flyway het schema beheren; Hibernate valideert alleen
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Database Migraties
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# BEANNNNN (CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}