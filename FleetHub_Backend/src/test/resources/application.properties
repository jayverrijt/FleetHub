spring.application.name=FleetHub_Backend_Test

# Snelle H2 In-Memory Database voor integratietests (@DataJpaTest)
spring.datasource.url=jdbc:h2:mem:fleethubtest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate maakt de tabellen in het RAM-geheugen aan en gooit ze na afloop weg
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway uitschakelen tijdens het testen zodat H2 niet struikelt over MySQL-syntax
spring.flyway.enabled=false